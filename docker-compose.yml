# Local development services only. Production uses managed PostgreSQL and object storage (TRD §7).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio']
      interval: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: portfolio
      MINIO_ROOT_PASSWORD: portfolio-secret
    ports:
      - '127.0.0.1:9100:9000'
      - '127.0.0.1:9101:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Creates private buckets (no anonymous policy) for dev and tests.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 portfolio portfolio-secret &&
      mc mb --ignore-existing local/portfolio-media &&
      mc mb --ignore-existing local/portfolio-media-test &&
      mc anonymous set none local/portfolio-media &&
      mc anonymous set none local/portfolio-media-test
      "

volumes:
  pgdata:
  miniodata:
